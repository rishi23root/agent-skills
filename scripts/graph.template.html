  .legend {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; padding: 7px 14px; font-size: 12.5px;

<body>
<header>
  <div class="brand"><h1>Skill graph</h1><span>How a task becomes a reviewed pull request</span></div>
  <div class="seg" id="views" role="group" aria-label="What to show"></div>

</header>
<div id="stage">

    </defs>

  </svg>
  <div class="float zoom">
    <button type="button" id="zin" aria-label="Zoom in">+</button>
    <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
    <button type="button" id="fit" class="txt" aria-label="Fit the graph to the screen">Fit</button>
  </div>
  <div class="legend">
    <ul id="kinds"></ul>
    <div class="keys">
      <div class="key"><svg><line x1="0" y1="4" x2="30" y2="4"/></svg><span>loads</span></div>
      <div class="key"><svg><line x1="0" y1="4" x2="30" y2="4" stroke-dasharray="5 4"/></svg><span>optional, or hands up</span></div>
      <label><input type="checkbox" id="labels">Name every arrow</label>
    </div>
  </div>
</div>
<aside id="panel"></aside>

<script>
var D = __DATA__;
var KINDS = {

  front:     { label: 'Front door',    color: '#57C7E3', edge: '#2FA3C2', r: 34 },
  seat:      { label: 'Seat',          color: '#6DCE9E', edge: '#43A877', r: 32 },
  procedure: { label: 'Procedure',     color: '#C990C0', edge: '#A9689F', r: 30 },
  extra:     { label: 'Extra',         color: '#FFC454', edge: '#D99E27', r: 25 },
  source:    { label: 'Provider repo', color: '#DA7194', edge: '#B84D72', r: 34 },
  ticket:    { label: 'Plan ticket',   color: '#B4BAC5', edge: '#8A92A1', r: 19 }
};
var ROWS = ['Manager', 'Front door', 'Seats', 'Procedures'];
var REL = {
  LOADS:           { out: 'Loads',               inn: 'Loaded by' },
  READS_FILE_FROM: { out: 'Reads a file from',   inn: 'Has a file read by' },
  ESCALATES_TO:    { out: 'Escalates to',        inn: 'Receives escalations from' },
  CAN_USE:         { out: 'Can use (optional extra)', inn: 'Available to' },
  FROM:            { out: 'Comes from',          inn: 'Provides' },
  ASSIGNED_TO:     { out: 'Assigned to',         inn: 'Plan tickets assigned here' },
  TOUCHES:         { out: 'Changes',             inn: 'Plan tickets that change this' }
};
var EDGE_CLASS = { CAN_USE: ' dashed soft', ESCALATES_TO: ' dashed', FROM: ' soft', TOUCHES: ' soft', ASSIGNED_TO: ' soft' };
var NS = 'http://www.w3.org/2000/svg';
function el(name, attrs, parent) {
  var e = document.createElementNS(NS, name);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function esc(s) {

// Up to two lines that fit inside the circle; the full name is in the panel.

// Where a node drifts to: skills in the middle, extras on the right, the plan on the left.

var svg = document.getElementById('svg'), view = document.getElementById('view');

    var hi = focus && (e.s === focus || e.t === focus);
    var dim = focus ? !hi : (query && (e.s.dim || e.t.dim));
    e.g.setAttribute('class', e.cls + (edgeVisible(e) ? '' : ' hidden') + (hi ? ' hi' : '') + (dim ? ' dim' : ''));
    e.line.setAttribute('marker-end', hi ? 'url(#arrow-hi)' : 'url(#arrow)');
  });
}
function item(n, extra) {
  return '<li class="link" data-id="' + esc(n.id) + '"><i style="background:' + KINDS[n.kind].color + '"></i><span>' +
    esc(n.kind === 'ticket' ? n.label + ' ' + n.title : n.label) + (extra ? ' <small>' + esc(extra) + '</small>' : '') + '</span></li>';
}
function group(title, list) {
  if (!list.length) return '';
  return '<h3>' + esc(title) + ' (' + list.length + ')</h3><ul>' + list.map(function (n) {
    return item(n, n.kind === 'extra' ? n.source : '');
  }).join('') + '</ul>';
}
function overview() {
  var h = '<h2>Who calls whom</h2><p>A small set of agent skills that work like a software team. You give a task in plain words and get back a reviewed pull request that waits for your word to merge.</p>';
  h += '<h3>How it works</h3><ol class="steps">' +
    '<li>You type <b>/factory</b> and a task. It is the manager.</li>' +
    '<li><b>improve</b> turns the task into a clear brief and decides how big it is.</li>' +
    '<li>A <b>seat</b> (junior, mid, senior or 10x) does the work. It loads a procedure only when a step needs it.</li>' +
    '<li><b>review</b> checks the change, never by its author. <b>ship</b> takes it to the merge gate and <b>runlog</b> records the run.</li></ol>';
  h += '<p class="muted">Hover a circle to see its links, or click it for details. A ringed circle is a skill you can type yourself. The buttons at the top add the third-party extras and the plan.</p>';
  h += '<h3>Start here</h3><ul>' + nodes.filter(function (n) { return n.typed; }).map(function (n) { return item(n, '/' + n.label); }).join('') + '</ul>';
  h += group('Provider repos', nodes.filter(function (n) { return n.kind === 'source'; }));
  if (D.plan) {
    h += '<h3>Plan</h3><p><a href="' + esc(D.plan.url) + '" target="_blank" rel="noopener">' + esc(D.plan.title) + '</a></p>';
    D.plan.phases.forEach(function (p) {
      if (!p.tickets.length) return;
      h += '<h3>' + esc(p.name) + '</h3><ul>' + p.tickets.map(function (id) { return item(byId[id]); }).join('') + '</ul>';
    });
  }
  return h + '<p class="muted" style="margin-top:20px">' + nodes.length + ' nodes and ' + edges.length +
    ' links, generated from the repository. <a href="' + esc(D.repo) + '" target="_blank" rel="noopener">View on GitHub</a></p>';
}
function detail(n) {
  var k = KINDS[n.kind];
  var h = '<p><span class="tag" style="background:' + k.color + '">' + esc(k.label) + '</span>' +
    (n.typed ? ' <span class="muted">you type /' + esc(n.label) + '</span>' : '') +
    (n.phase ? ' <span class="muted">' + esc(n.phase) + '</span>' : '') + '</p>';
  h += '<h2>' + esc(n.kind === 'ticket' ? n.label + ': ' + n.title : n.label) + '</h2>';
  h += '<p>' + esc(n.desc || '') + '</p>';
  if (n.touches) h += '<p class="muted">Touches: ' + esc(n.touches) + '</p>';
  if (n.refs && n.refs.length) h += '<p class="muted">Reference files: ' + esc(n.refs.join(', ')) + '</p>';
  h += '<div class="actions"><a class="btn" href="' + esc(n.url) + '" target="_blank" rel="noopener">Open on GitHub</a>' +
    '<button type="button" class="btn" id="back">Back to overview</button></div>';
  Object.keys(REL).forEach(function (type) {
    h += group(REL[type].out, n.out.filter(function (e) { return e.type === type; }).map(function (e) { return e.t; }));
  });
  Object.keys(REL).forEach(function (type) {
    h += group(REL[type].inn, n.inn.filter(function (e) { return e.type === type; }).map(function (e) { return e.s; }));
  });
  return h;
}
var panel = document.getElementById('panel');
function setHash(value) {
  try { history.replaceState(null, '', value ? '#' + encodeURIComponent(value) : location.pathname + location.search); } catch (e) {}
}
function select(id) {
  selected = id ? byId[id] : null;
  if (selected && !shown[selected.kind]) setKind(selected.kind, true);
  panel.innerHTML = selected ? detail(selected) : overview();
  panel.scrollTop = 0;
  setHash(selected ? selected.id : currentView);
  refresh();
}
panel.addEventListener('click', function (ev) {
  var li = ev.target.closest('li.link');
  if (li) select(li.getAttribute('data-id'));
  else if (ev.target.id === 'back') select(null);
});

// Views are presets over the legend's on and off switches.
var CORE = ['manager', 'front', 'seat', 'procedure'];
var VIEWS = {
  core:   { label: 'Core skills', kinds: CORE },
  extras: { label: '+ Extras', kinds: CORE.concat(['extra', 'source']) },
  plan:   { label: '+ Plan', kinds: CORE.concat(['ticket']) },
  all:    { label: 'Everything', kinds: Object.keys(KINDS) }
};
var chips = {}, viewButtons = {}, currentView = '';
function sync(view) {
  currentView = view || '';
  Object.keys(KINDS).forEach(function (kind) {
    chips[kind].className = shown[kind] ? '' : 'off';
    chips[kind].setAttribute('aria-pressed', shown[kind] ? 'true' : 'false');
  });
  Object.keys(VIEWS).forEach(function (v) { viewButtons[v].className = v === view ? 'on' : ''; });
  refresh(); settle();
}
function setKind(kind, on) { shown[kind] = on; sync(null); }
function setView(view) {
  Object.keys(KINDS).forEach(function (kind) { shown[kind] = VIEWS[view].kinds.indexOf(kind) >= 0; });
  if (selected && !shown[selected.kind]) { selected = null; panel.innerHTML = overview(); }
  sync(view);
  if (!selected) setHash(view === 'core' ? '' : view);
}
Object.keys(VIEWS).forEach(function (view) {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = VIEWS[view].label;
  b.addEventListener('click', function () { setView(view); });
  viewButtons[view] = b;
  document.getElementById('views').appendChild(b);
});
Object.keys(KINDS).forEach(function (kind) {
  var c = document.createElement('li');
  c.tabIndex = 0; c.setAttribute('role', 'button');
  c.innerHTML = '<i style="background:' + KINDS[kind].color + '"></i>' + esc(KINDS[kind].label);
  function toggle() { setKind(kind, !shown[kind]); }
  c.addEventListener('click', toggle);
  c.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
  chips[kind] = c;
  document.getElementById('kinds').appendChild(c);
});
document.getElementById('q').addEventListener('input', function (ev) { query = ev.target.value.trim().toLowerCase(); refresh(); });
document.getElementById('labels').addEventListener('change', function (ev) { svg.classList.toggle('nolabels', !ev.target.checked); });

// The address can name a view (#all) or a node (#mid), so a link opens where you were.
var start = decodeURIComponent(location.hash.slice(1));
panel.innerHTML = overview();
if (byId[start]) { setView(CORE.indexOf(byId[start].kind) >= 0 ? 'core' : 'all'); select(start); }
else setView(VIEWS[start] ? start : 'core');
window.addEventListener('resize', fit);
</script>
</body>
</html>
