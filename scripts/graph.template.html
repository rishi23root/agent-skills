<!-- site-header:script:start
     Light, dark or system. The choice is kept in the browser under one key, so
     every page of the site shares it. With scripts off the control stays
     hidden and the page follows the system. -->
<script>
(function () {
  var KEY = 'agent-skills-theme';
  var root = document.documentElement;
  var box = document.getElementById('site-theme');
  var buttons = box.querySelectorAll('button');
  function stored() {
    try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : 'system'; }
    catch (e) { return 'system'; }
  }
  function keep(choice) {
    try { if (choice === 'system') localStorage.removeItem(KEY); else localStorage.setItem(KEY, choice); }
    catch (e) { /* No storage: the choice lasts for this page only. */ }
  }
  function show(choice) {
    if (choice === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', choice);
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', String(buttons[i].getAttribute('data-theme-choice') === choice));
    }
  }
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function () {
      var choice = this.getAttribute('data-theme-choice');
      keep(choice); show(choice);
    });
  }
  window.addEventListener('storage', function (e) { if (e.key === KEY || e.key === null) show(stored()); });
  var here = document.querySelector('.site-seg a[data-view="' + root.getAttribute('data-view') + '"]');
  if (here) here.setAttribute('aria-current', 'page');
  show(stored());
  box.hidden = false;
})();
</script>
<!-- site-header:script:end -->

[
  { "title": "You type a task",
    "text": "You type /factory and a task in your own words. {factory}, the manager, loads {improve}, which turns your words into a clear brief with a size and a risk." },
  { "title": "The manager picks a seat",
    "text": "A seat is a role on the team. {factory} gives the work to the smallest seat that can do it well: {junior} for one small task, {mid} for a feature, {senior} for a project, {10x} when the goal itself is unclear." },

  walk = i;
  var st = WALK[i], count = 'Step ' + (i + 1) + ' of ' + WALK.length;
  document.getElementById('walk-n').textContent = 'Follow one task: ' + count.toLowerCase();
  document.getElementById('walk-t').textContent = st.title;
  document.getElementById('walk-p').innerHTML = st.html;
  // Read out by a screen reader each time the step changes.
  document.getElementById('walk-say').textContent = count + '. ' + st.title + '. ' + st.plain;
  // A disabled button cannot hold the focus, so hand it on first.
  if (i === 0 && document.activeElement === walkBack) walkNext.focus();
  walkBack.disabled = i === 0;
  walkNext.textContent = i === WALK.length - 1 ? 'Done' : 'Next';
  walkBox.hidden = false; document.body.classList.add('walking');
  walkOpen.setAttribute('aria-expanded', 'true');
  refresh(); fit(true);
}
// asked: the visitor pressed the button, so the keyboard focus follows them in.
function startWalk(asked) {
  if (!WALK.length) return;
  try { localStorage.setItem(WALK_SEEN, '1'); } catch (e) { /* No storage: it opens again next time. */ }
  selected = null; hover = null; panel.innerHTML = overview();
  setView('core'); showStep(0);
  if (asked) walkNext.focus();
}
function leaveWalk() {
  if (walk == null) return;
  var inside = walkBox.contains(document.activeElement);
  walk = null; walkBox.hidden = true; document.body.classList.remove('walking');
  walkOpen.setAttribute('aria-expanded', 'false');
  document.getElementById('walk-say').textContent = '';
  if (inside) walkOpen.focus();
  refresh(); fit(true);
}
walkOpen.setAttribute('aria-expanded', 'false');
walkOpen.setAttribute('aria-controls', 'walk');
walkOpen.addEventListener('click', function () { startWalk(true); });
document.getElementById('walk-x').addEventListener('click', leaveWalk);
walkBack.addEventListener('click', function () { if (walk > 0) showStep(walk - 1); });
walkNext.addEventListener('click', function () { if (walk < WALK.length - 1) showStep(walk + 1); else leaveWalk(); });
document.addEventListener('keydown', function (ev) {
  if (walk == null || ev.target.tagName === 'INPUT' || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.key === 'Escape') leaveWalk();
  else if (ev.key === 'ArrowRight' && walk < WALK.length - 1) showStep(walk + 1);
  else if (ev.key === 'ArrowLeft' && walk > 0) showStep(walk - 1);
});

// The address can name a view (#all) or a node (#mid), so a link opens where you were.
// #walk starts the walkthrough.
var start = decodeURIComponent(location.hash.slice(1));
panel.innerHTML = overview();
if (byId[start]) { setView(CORE.indexOf(byId[start].kind) >= 0 ? 'core' : 'all'); select(start); }
else setView(VIEWS[start] ? start : 'core');
window.addEventListener('resize', function () { fit(); });
// A first visit opens on step one, unless the address asked for something else.
var walkSeen = false;
try { walkSeen = localStorage.getItem(WALK_SEEN) === '1'; } catch (e) { /* No storage: treat it as a first visit. */ }
if (start === 'walk' || (!start && !walkSeen)) startWalk(false);
window.addEventListener('hashchange', function () { if (location.hash === '#walk') startWalk(false); });
</script>
