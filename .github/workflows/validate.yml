name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check skills and generated files
        run: node scripts/validate.mjs
      - name: Check the interactive graph page
        run: node scripts/graph.mjs --check
      - name: Fetch pinned upstream skills
        run: node scripts/sync-upstream.mjs
      - name: Check pinned extras exist and call only pinned skills
        run: node scripts/validate.mjs --upstream upstream
