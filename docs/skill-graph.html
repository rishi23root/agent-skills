var KINDS = {
  manager:   { label: 'Manager',     color: '#F79767', r: 36 },
  front:     { label: 'Front door',  color: '#57C7E3', r: 34 },
  seat:      { label: 'Seat',        color: '#6DCE9E', r: 32 },
  procedure: { label: 'Procedure',   color: '#C990C0', r: 30 },

  source:    { label: 'Provider repo', color: '#DA7194', r: 34 },
  ticket:    { label: 'Plan ticket', color: '#A5ABB6', r: 19 }
};
var REL = {
  LOADS:           { out: 'Loads',               inn: 'Loaded by' },
  READS_FILE_FROM: { out: 'Reads a file from',   inn: 'Has a file read by' },
  ESCALATES_TO:    { out: 'Escalates to',        inn: 'Receives escalations from' },
  CAN_USE:         { out: 'Can use (optional extra)', inn: 'Available to' },
  FROM:            { out: 'Comes from',          inn: 'Provides' },

var NS = 'http://www.w3.org/2000/svg';
function el(name, attrs, parent) {
  var e = document.createElementNS(NS, name);
  for (var k in attrs) e.setAttribute(k, attrs[k]);

  return e;
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
// Up to two lines that fit inside the circle; the full name is in the panel.
function wrap(label, max) {
  if (label.length <= max) return [label];
  var words = label.split('-'), lines = [''], i;
  for (i = 0; i < words.length; i++) {
    var w = words[i] + (i < words.length - 1 ? '-' : '');
    var cur = lines[lines.length - 1];
    if (cur && (cur + w).length > max) lines.push(w); else lines[lines.length - 1] = cur + w;
  }
  if (lines.length > 2) lines = [lines[0], lines.slice(1).join('')];
  return lines.map(function (l) { return l.length > max ? l.slice(0, max - 1) + '…' : l; });
}

var svg = document.getElementById('svg'), view = document.getElementById('view');
var byId = {}, shown = {}, selected = null, query = '';
var nodes = D.nodes.map(function (n, i) {
  var k = KINDS[n.kind], a = i * 2.39996, rad = 34 * Math.sqrt(i + 1);
  n.r = k.r; n.x = Math.cos(a) * rad; n.y = Math.sin(a) * rad; n.vx = 0; n.vy = 0; n.deg = 0;
  n.out = []; n.inn = [];
  byId[n.id] = n;
  return n;
});
var edges = D.edges.map(function (e) {
  e.s = byId[e.from]; e.t = byId[e.to];
  e.s.deg++; e.t.deg++; e.s.out.push(e); e.t.inn.push(e);
  return e;
});
for (var kind in KINDS) shown[kind] = true;

edges.forEach(function (e) {
  e.g = el('g', { 'class': 'edge' + (e.type === 'CAN_USE' || e.type === 'ESCALATES_TO' ? ' dashed' : '') }, document.getElementById('edges'));
  e.line = el('line', { 'marker-end': 'url(#arrow)' }, e.g);
  e.text = el('text', { dy: -2.5 }, e.g);
  e.text.textContent = e.type;
});
nodes.forEach(function (n) {
  n.g = el('g', { 'class': 'node' }, document.getElementById('nodes'));
  el('circle', { r: n.r, fill: KINDS[n.kind].color }, n.g);
  var lines = wrap(n.label, Math.floor(n.r * 2 / 5.6));
  lines.forEach(function (l, i) {
    el('text', { y: (i - (lines.length - 1) / 2) * 11 + 3.3 }, n.g).textContent = l;
  });
  el('title', {}, n.g).textContent = n.label + (n.title ? ': ' + n.title : '');
});

function visible(n) { return shown[n.kind]; }
function edgeVisible(e) { return visible(e.s) && visible(e.t); }

// A small force layout: nodes repel, edges pull, everything drifts to the centre.
var alpha = 1, raf = 0;
function tick() {
  var vs = nodes.filter(visible), i, j, a, b, dx, dy, d2, f;
  for (i = 0; i < vs.length; i++) {
    a = vs[i];
    for (j = i + 1; j < vs.length; j++) {
      b = vs[j]; dx = b.x - a.x || 0.01; dy = b.y - a.y || 0.01; d2 = dx * dx + dy * dy;
      f = 1300 * alpha / d2;
      var min = a.r + b.r + 10, d = Math.sqrt(d2);
      if (d < min) f += (min - d) / d * 0.5;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
    a.vx -= a.x * 0.03 * alpha; a.vy -= a.y * 0.03 * alpha;
  }
  edges.forEach(function (e) {
    if (!edgeVisible(e)) return;
    var dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    var want = e.s.r + e.t.r + 45;
    var f = (d - want) / d * alpha * 0.9 / Math.min(e.s.deg, e.t.deg, 6);
    e.s.vx += dx * f * 0.5; e.s.vy += dy * f * 0.5; e.t.vx -= dx * f * 0.5; e.t.vy -= dy * f * 0.5;
  });
  vs.forEach(function (n) {
    n.vx *= 0.6; n.vy *= 0.6;
    if (n.held) { n.vx = n.vy = 0; return; }
    n.x += n.vx; n.y += n.vy;
  });
  alpha += (0 - alpha) * 0.02;
}
function draw() {
  nodes.forEach(function (n) { n.g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')'); });
  edges.forEach(function (e) {
    if (!edgeVisible(e)) return;
    var dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / d, uy = dy / d;
    var x1 = e.s.x + ux * e.s.r, y1 = e.s.y + uy * e.s.r;
    var x2 = e.t.x - ux * (e.t.r + 2), y2 = e.t.y - uy * (e.t.r + 2);
    e.line.setAttribute('x1', x1); e.line.setAttribute('y1', y1);
    e.line.setAttribute('x2', x2); e.line.setAttribute('y2', y2);
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    if (ang > 90 || ang < -90) ang += 180;
    e.text.setAttribute('transform', 'translate(' + (x1 + x2) / 2 + ',' + (y1 + y2) / 2 + ') rotate(' + ang + ')');
  });
}
function loop() {
  tick(); draw();
  raf = alpha > 0.005 ? requestAnimationFrame(loop) : 0;
}
function reheat(a) { alpha = Math.max(alpha, a); if (!raf) raf = requestAnimationFrame(loop); }

// Pan and zoom.
var scale = 1, tx = 0, ty = 0;
function applyView() { view.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')'); }
function fit() {
  var vs = nodes.filter(visible), box = svg.getBoundingClientRect();
  if (!vs.length || !box.width) return;
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  vs.forEach(function (n) {
    x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r);
    x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r);
  });
  scale = Math.min(box.width / (x1 - x0 + 60), box.height / (y1 - y0 + 60), 1.6);
  tx = box.width / 2 - (x0 + x1) / 2 * scale; ty = box.height / 2 - (y0 + y1) / 2 * scale;
  applyView();
}
function toGraph(ev) {
  var box = svg.getBoundingClientRect();
  return { x: (ev.clientX - box.left - tx) / scale, y: (ev.clientY - box.top - ty) / scale };
}
svg.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  var box = svg.getBoundingClientRect(), mx = ev.clientX - box.left, my = ev.clientY - box.top;
  var next = Math.min(4, Math.max(0.15, scale * Math.exp(-ev.deltaY * 0.0015)));
  tx = mx - (mx - tx) * next / scale; ty = my - (my - ty) * next / scale; scale = next;
  applyView();
}, { passive: false });

var drag = null;
svg.addEventListener('pointerdown', function (ev) {
  var g = ev.target.closest ? ev.target.closest('.node') : null, node = null;
  if (g) node = nodes.filter(function (n) { return n.g === g; })[0];
  drag = { node: node, x: ev.clientX, y: ev.clientY, tx: tx, ty: ty, moved: false };
  if (node) node.held = true; else svg.classList.add('panning');
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', function (ev) {
  if (!drag) return;
  if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 4) drag.moved = true;
  if (!drag.moved) return;
  if (drag.node) {
    var p = toGraph(ev); drag.node.x = p.x; drag.node.y = p.y; reheat(0.3);
  } else {
    tx = drag.tx + ev.clientX - drag.x; ty = drag.ty + ev.clientY - drag.y; applyView();
  }
});
function endDrag() {
  if (!drag) return;
  if (drag.node) drag.node.held = false;
  if (!drag.moved) select(drag.node ? drag.node.id : null);
  svg.classList.remove('panning');
  drag = null;
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

// Selection, search and filters all end in one pass over the classes.
function refresh() {
  var near = {};
  if (selected) {
    near[selected.id] = true;
    selected.out.forEach(function (e) { near[e.t.id] = true; });
    selected.inn.forEach(function (e) { near[e.s.id] = true; });
  }
  nodes.forEach(function (n) {
    var hit = !query || (n.label + ' ' + (n.title || '') + ' ' + (n.desc || '')).toLowerCase().indexOf(query) >= 0;
    var dim = selected ? !near[n.id] : !hit;
    n.g.setAttribute('class', 'node' + (visible(n) ? '' : ' hidden') + (dim ? ' dim' : '') + (n === selected ? ' sel' : ''));
  });
  edges.forEach(function (e) {
    var hi = selected && (e.s === selected || e.t === selected);
    var dim = selected ? !hi : (query && e.s.g.getAttribute('class').indexOf('dim') >= 0 && e.t.g.getAttribute('class').indexOf('dim') >= 0);
    var base = e.g.getAttribute('class').indexOf('dashed') >= 0 ? 'edge dashed' : 'edge';
    e.g.setAttribute('class', base + (edgeVisible(e) ? '' : ' hidden') + (hi ? ' hi' : '') + (dim ? ' dim' : ''));
    e.line.setAttribute('marker-end', hi ? 'url(#arrow-hi)' : 'url(#arrow)');
  });
}
function item(n, extra) {
  return '<li class="link" data-id="' + esc(n.id) + '"><i style="background:' + KINDS[n.kind].color + '"></i><span>' +
    esc(n.kind === 'ticket' ? n.label + ' ' + n.title : n.label) + (extra ? ' <small>' + esc(extra) + '</small>' : '') + '</span></li>';
}

    return item(n, n.kind === 'extra' ? n.source : '');
  }).join('') + '</ul>';
}
function overview() {
  var count = {};
  nodes.forEach(function (n) { count[n.kind] = (count[n.kind] || 0) + 1; });
  var h = '<h2>Who calls whom</h2><p class="muted">' + nodes.length + ' nodes and ' + edges.length +
    ' links, generated from the skills, <code>upstream.lock.json</code> and the newest plan. Click a node to see what it loads and what loads it.</p>';
  h += '<h3>Entry points</h3><ul>' + nodes.filter(function (n) { return n.typed; }).map(function (n) { return item(n, 'typed by you'); }).join('') + '</ul>';
  h += group('Provider repos', nodes.filter(function (n) { return n.kind === 'source'; }));
  if (D.plan) {
    h += '<h3>Plan</h3><p><a href="' + esc(D.plan.url) + '" target="_blank" rel="noopener">' + esc(D.plan.title) + '</a></p>';
    D.plan.phases.forEach(function (p) {
      if (!p.tickets.length) return;
      h += '<h3>' + esc(p.name) + '</h3><ul>' + p.tickets.map(function (id) { return item(byId[id]); }).join('') + '</ul>';
    });

}
function detail(n) {
  var k = KINDS[n.kind];
  var h = '<p><span class="tag" style="background:' + k.color + '">' + esc(k.label) + '</span>' +
    (n.typed ? ' <span class="muted">typed by you as /' + esc(n.label) + '</span>' : '') +
    (n.phase ? ' <span class="muted">' + esc(n.phase) + '</span>' : '') + '</p>';
  h += '<h2>' + esc(n.kind === 'ticket' ? n.label + ': ' + n.title : n.label) + '</h2>';
  h += '<p>' + esc(n.desc || '') + '</p>';
  if (n.touches) h += '<p class="muted">Touches: ' + esc(n.touches) + '</p>';
  if (n.refs && n.refs.length) h += '<p class="muted">Reference files: ' + esc(n.refs.join(', ')) + '</p>';
  h += '<p><a href="' + esc(n.url) + '" target="_blank" rel="noopener">Open on GitHub</a></p>';
  Object.keys(REL).forEach(function (type) {
    h += group(REL[type].out, n.out.filter(function (e) { return e.type === type; }).map(function (e) { return e.t; }));
  });
  Object.keys(REL).forEach(function (type) {
    h += group(REL[type].inn, n.inn.filter(function (e) { return e.type === type; }).map(function (e) { return e.s; }));

var panel = document.getElementById('panel');
function select(id) {
  selected = id ? byId[id] : null;

  panel.innerHTML = selected ? detail(selected) : overview();
  panel.scrollTop = 0;

var chips = {};

Object.keys(KINDS).forEach(function (kind) {
