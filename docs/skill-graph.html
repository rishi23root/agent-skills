<!-- site-header:script:start
     Light, dark or system. The choice is kept in the browser under one key, so
     every page of the site shares it. With scripts off the control stays
     hidden and the page follows the system. -->
<script>
(function () {
  var KEY = 'agent-skills-theme';
  var root = document.documentElement;
  var box = document.getElementById('site-theme');
  var buttons = box.querySelectorAll('button');
  function stored() {
    try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : 'system'; }
    catch (e) { return 'system'; }
  }
  function keep(choice) {
    try { if (choice === 'system') localStorage.removeItem(KEY); else localStorage.setItem(KEY, choice); }
    catch (e) { /* No storage: the choice lasts for this page only. */ }
  }
  function show(choice) {
    if (choice === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', choice);
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', String(buttons[i].getAttribute('data-theme-choice') === choice));
    }
  }
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function () {
      var choice = this.getAttribute('data-theme-choice');
      keep(choice); show(choice);
    });
  }
  window.addEventListener('storage', function (e) { if (e.key === KEY || e.key === null) show(stored()); });
  var here = document.querySelector('.site-seg a[data-view="' + root.getAttribute('data-view') + '"]');
  if (here) here.setAttribute('aria-current', 'page');
  show(stored());
  box.hidden = false;
})();
</script>
<!-- site-header:script:end -->

<!-- Follow one task: the steps of the walkthrough. A {name} is a skill the step
     lights in the graph. `node scripts/graph.mjs` reads this block and fails
     when a name is not a skill, so a renamed skill cannot leave a dead step. -->
<script type="application/json" id="walk-steps">
[
  { "title": "You type a task",
    "text": "You type /factory and a task in your own words. {factory}, the manager, loads {improve}, which turns your words into a clear brief with a size and a risk." },
  { "title": "The manager picks a seat",
    "text": "A seat is a role on the team. {factory} gives the work to the smallest seat that can do it well: {junior} for one small task, {mid} for a feature, {senior} for a project, {10x} when the goal itself is unclear." },
  { "title": "The seat builds it",
    "text": "Here {mid} owns a feature. It loads {tickets} to slice the work into small pieces and {build} to make each piece and prove it works. It can hand a piece to {junior}." },
  { "title": "Someone else reviews it",
    "text": "{review} checks the change, and the reviewer is never the author. A problem goes back to {mid} to be fixed, for a capped number of rounds." },
  { "title": "It waits for your word",
    "text": "{ship} opens the pull request and brings it to the merge gate, where it waits until you say merge. {runlog} records the run, and {factory} reports back to you." }
]

var D = {"repo":"https://github.com/rishi23root/agent-skills","nodes":[{"id":"factory","kind":"manager","label":"factory","desc":"Manager for the whole software factory. Takes a task in any wording, improves it into a brief, sizes it, routes it to the right seat, checks the result, and reports. Start here when unsure.","layer":0,"typed":true,"refs":[],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/factory/SKILL.md"},{"id":"10x","kind":"seat","label":"10x","desc":"Staff seat. Enters only when the team is blocked or the leverage is large: unclear scope, a design choice between different kinds of answer, a multi-model council, a wide refactor, or a rescue. Frames it and leaves.","layer":1,"typed":true,"refs":["extras.md"],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/10x/SKILL.md"},{"id":"junior","kind":"seat","label":"junior","desc":"Junior seat. Builds one ready ticket in one worktree, proves it, opens one small PR and watches its checks. Stops and asks when a fact is missing.","layer":1,"typed":true,"refs":["extras.md"],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/junior/SKILL.md"},{"id":"mid","kind":"seat","label":"mid","desc":"Mid seat. Owns a feature end to end: slices it into tickets with file ownership, builds or hands leaf tickets to junior, diagnoses bugs, and reviews junior PRs.","layer":1,"typed":true,"refs":["extras.md"],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/mid/SKILL.md"},{"id":"senior","kind":"seat","label":"senior","desc":"Senior seat and fleet manager. Owns the spec gate, decides when work may run in parallel, dispatches mid and junior workers, reviews risky changes, and owns the merge gate.","layer":1,"typed":true,"refs":["extras.md"],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/senior/SKILL.md"},{"id":"build","kind":"procedure","label":"build","desc":"Procedure. Implements one ticket: failing check first, smallest change that passes, SKILL.md"},{"id":"runlog","kind":"procedure","label":"runlog","desc":"Procedure. Records one row per worker run (task type, seat, model, cost, outcome, lesson) so later model choice and process changes rest on data.","layer":2,"typed":false,"refs":["reflect.md"],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/runlog/SKILL.md"},{"id":"setup","kind":"procedure","label":"setup","desc":"First-run interview. Checks a machine and a project for what a factory run needs, asks only for what it cannot detect, writes on a yes, and ends with one table of what is ready and the fix for what is not.","layer":2,"typed":true,"refs":["machine.md","project.md"],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/setup/SKILL.md"},{"id":"ship","kind":"procedure","label":"ship","desc":"Procedure. Opens the PR, watches checks and review bots, and brings the change to the merge gate. Merges only on the owner's word.","layer":2,"typed":true,"refs":[],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/ship/SKILL.md"},{"id":"spec","kind":"procedure","label":"spec","desc":"Procedure. Writes a spec from an accepted brief and takes it through the spec gate: no open design questions, named seams, checkable acceptance.","layer":2,"typed":true,"refs":[],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/spec/SKILL.md"},{"id":"tickets","kind":"procedure","label":"tickets","desc":"Procedure. Slices a brief or spec into small vertical tickets with blocking edges and file ownership, and marks them ready for an agent.","layer":2,"typed":false,"refs":["ticket-format.md"],"url":"https://github.com/rishi23root/agent-skills/blob/main/skills/tickets/SKILL.md"},{"id":"src:mattpocock","kind":"source","label":"mattpocock","desc":"mattpocock/skills, pinned at 5863806. License: MIT.","url":"https://github.com/mattpocock/skills/tree/5863806dd4e15c63174bee4e7515a4256792ecfa"},{"id":"src:tstack","kind":"source","label":"tstack","desc":"t3dotgg/tst   el('title', {}, n.g).textContent = n.label + (n.title ? ': ' + n.title : '');
  n.g.addEventListener('pointerenter', function () { if (!drag) { hover = n; refresh(); } });
  n.g.addEventListener('pointerleave', function () { if (hover === n) { hover = null; refresh(); } });
});

function visible(n) { return shown[n.kind]; }
function edgeVisible(e) { return visible(e.s) && visible(e.t); }

// A small force layout: nodes repel, edges pull, each group drifts to its home.
// Skills are held on the row of their layer, so the page reads top to bottom.
var alpha = 1, raf = 0;
function tick() {
  var vs = nodes.filter(visible), i, j, a, b, dx, dy, d2, f;
  for (i = 0; i < vs.length; i++) {
    a = vs[i];
    for (j = i + 1; j < vs.length; j++) {
      b = vs[j]; dx = b.x - a.x || 0.01; dy = b.y - a.y || 0.01; d2 = dx * dx + dy * dy;
      f = 1300 * alpha / d2;
      var min = a.r + b.r + 22, d = Math.sqrt(d2);
      if (d < min) f += (min - d) / d * 0.5;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
    a.vx -= (a.x - homeX(a)) * (a.layer != null ? 0.035 : 0.07) * alpha; a.vy -= a.y * (a.layer != null ? 0.03 : 0.075) * alpha;
  }
  edges.forEach(function (e) {
    if (!edgeVisible(e)) return;
    var dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    var want = e.s.r + e.t.r + 45;
    var f = (d - want) / d * alpha * (e.soft ? 0.12 : 0.9) / Math.min(e.s.deg, e.t.deg, 6);
    e.s.vx += dx * f * 0.5; e.s.vy += dy * f * 0.5; e.t.vx -= dx * f * 0.5; e.t.vy -= dy * f * 0.5;
  });
  vs.forEach(function (n) {
    n.vx *= 0.6; n.vy *= 0.6;
    if (n.held) { n.vx = n.vy = 0; return; }
    n.x += n.vx; n.y += n.vy;
    if (n.layer != null) n.y += (rowY(n.layer) - n.y) * 0.22;
  });
  alpha += (0 - alpha) * 0.02;
}
function drawBands() {
  var g = document.getElementById('bands'), skills = nodes.filter(function (n) { return n.layer != null && visible(n); });
  while (g.firstChild) g.removeChild(g.firstChild);
  bandX0 = null;
  if (!skills.length) return;
  var x0 = Infinity, x1 = -Infinity, layers = {};
  skills.forEach(function (n) { x0 = Math.min(x0, n.x - n.r); x1 = Math.max(x1, n.x + n.r); layers[n.layer] = true; });
  bandX0 = x0 - 150;
  Object.keys(layers).forEach(function (layer) {
    var b = el('g', { 'class': 'band' }, g), y = rowY(Number(layer));
    el('rect', { x: bandX0, y: y - 58, width: x1 + 40 - bandX0, height: 116, rx: 16 }, b);
    el('text', { x: bandX0 + 16, y: y + 4 }, b).textContent = (ROWS[layer] || '').toUpperCase();
  });
}
function draw() {
  nodes.forEach(function (n) { n.g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')'); });
  edges.forEach(function (e) {
    if (!edgeVisible(e)) return;
    var dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / d, uy = dy / d;
    var x1 = e.s.x + ux * e.s.r, y1 = e.s.y + uy * e.s.r;
    var x2 = e.t.x - ux * (e.t.r + 3), y2 = e.t.y - uy * (e.t.r + 3);
    e.line.setAttribute('x1', x1); e.line.setAttribute('y1', y1);
    e.line.setAttribute('x2', x2); e.line.setAttribute('y2', y2);
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    if (ang > 90 || ang < -90) ang += 180;
    e.text.setAttribute('transform', 'translate(' + (x1 + x2) / 2 + ',' + (y1 + y2) / 2 + ') rotate(' + ang + ')');
  });
}
function loop() {
  tick(); draw();
  if (alpha > 0.005) raf = requestAnimationFrame(loop); else { raf = 0; drawBands(); }
}
function settle() {
  alpha = 1;
  for (var i = 0; i < 320; i++) tick();
  alpha = 0; draw(); drawBands(); fit();
}
function reheat(a) { alpha = Math.max(alpha, a); if (!raf) raf = requestAnimationFrame(loop); }

// Pan and zoom.
var scale = 1, tx = 0, ty = 0;
function applyView() { view.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')'); }
function fit() {
  // During the walkthrough, fit to the skills of the step on show.
  var lit = walk != null ? walkSet() : null, box = svg.getBoundingClientRect();
  var vs = nodes.filter(function (n) { return visible(n) && (!lit || lit[n.id]); });
  if (!vs.length || !box.width) return;
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  vs.forEach(function (n) {
    x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r);
    x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r);
  });
  // Keep the row labels on screen, in the walkthrough too.
  if (bandX0 != null) x0 = Math.min(x0, bandX0);
  scale = Math.min(box.width / (x1 - x0 + 70), box.height / (y1 - y0 + 90), 1.5);
  tx = box.width / 2 - (x0 + x1) / 2 * scale; ty = box.height / 2 - (y0 + y1) / 2 * scale;
  applyView();
}
function zoomAt(mx, my, factor) {
  var next = Math.min(4, Math.max(0.15, scale * factor));
  tx = mx - (mx - tx) * next / scale; ty = my - (my - ty) * next / scale; scale = next;
  applyView();
}
function zoomCentre(factor) { var b = svg.getBoundingClientRect(); zoomAt(b.width / 2, b.height / 2, factor); }
function toGraph(ev) {
  var box = svg.getBoundingClientRect();
  return { x: (ev.clientX - box.left - tx) / scale, y: (ev.clientY - box.top - ty) / scale };
}
svg.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  var box = svg.getBoundingClientRect();
  zoomAt(ev.clientX - box.left, ev.clientY - box.top, Math.exp(-ev.deltaY * 0.0015));
}, { passive: false });
document.getElementById('zin').addEventListener('click', function () { zoomCentre(1.3); });
document.getElementById('zout').addEventListener('click', function () { zoomCentre(1 / 1.3); });
document.getElementById('fit').addEventListener('click', fit);

var drag = null;
svg.addEventListener('pointerdown', function (ev) {
  var g = ev.target.closest ? ev.target.closest('.node') : null, node = null;
  if (g) node = nodes.filter(function (n) { return n.g === g; })[0];
  drag = { node: node, x: ev.clientX, y: ev.clientY, tx: tx, ty: ty, moved: false };
  if (node) node.held = true; else svg.classList.add('panning');
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', function (ev) {
  if (!drag) return;
  if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 4) drag.moved = true;
  if (!drag.moved) return;
  if (drag.node) {
    var p = toGraph(ev); drag.node.x = p.x; drag.node.y = p.y; reheat(0.3);
  } else {
    tx = drag.tx + ev.clientX - drag.x; ty = drag.ty + ev.clientY - drag.y; applyView();
  }
});
function endDrag() {
  if (!drag) return;
  if (drag.node) drag.node.held = false;
  if (!drag.moved) select(drag.node ? drag.node.id : null);
  svg.classList.remove('panning');
  drag = null;
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

// Selection, hover, search, filters and the walkthrough all end in one pass over the classes.
function refresh() {
  var near = {}, focus = selected || hover, lit = !focus && walk != null ? walkSet() : null;
  if (focus) {
    near[focus.id] = true;
    focus.out.forEach(function (e) { near[e.t.id] = true; });
    focus.inn.forEach(function (e) { near[e.s.id] = true; });
  }
  nodes.forEach(function (n) {
    var hit = !query || (n.label + ' ' + (n.title || '') + ' ' + (n.desc || '')).toLowerCase().indexOf(query) >= 0;
    n.dim = focus ? !near[n.id] : lit ? !lit[n.id] : !hit;
    n.g.setAttribute('class', n.cls + (visible(n) ? '' : ' hidden') + (n.dim ? ' dim' : '') + (n === selected ? ' sel' : ''));
  });
  edges.forEach(function (e) {
    var hi = focus ? (e.s === focus || e.t === focus) : !!(lit && lit[e.s.id] && lit[e.t.id]);
    var dim = focus || lit ? !hi : (query && (e.s.dim || e.t.dim));
    e.g.setAttribute('class', e.cls + (edgeVisible(e) ? '' : ' hidden') + (hi ? ' hi' : '') + (dim ? ' dim' : ''));
    e.line.setAttribute('marker-end', hi ? 'url(#arrow-hi)' : 'url(#arrow)');
  });
}
function item(n, extra) {
  return '<li class="link" data-id="' + esc(n.id) + '"><i class="k-' + n.kind + '"></i><span>' +
    esc(n.kind === 'ticket' ? n.label + ' ' + n.title : n.label) + (extra ? ' <small>' + esc(extra) + '</small>' : '') + '</span></li>';
}
function group(title, list) {
  if (!list.length) return '';
  return '<h3>' + esc(title) + ' (' + list.length + ')</h3><ul>' + list.map(function (n) {
    return item(n, n.kind === 'extra' ? n.source : '');
  }).join('') + '</ul>';
}
function overview() {
  var h = '<h2>Who calls whom</h2><p>A small set of agent skills that work like a software team. You give a task in plain words and get back a reviewed pull request that waits for your word to merge.</p>';
  h += '<h3>How it works</h3><ol class="steps">' +
    '<li>You type <b>/factory</b> and a task. It is the manager.</li>' +
    '<li><b>improve</b> turns the task into a clear brief and decides how big it is.</li>' +
    '<li>A <b>seat</b> (junior, mid, senior or 10x) does the work. It loads a procedure only when a step needs it.</li>' +
    '<li><b>review</b> checks the change, never by its author. <b>ship</b> takes it to the merge gate and <b>runlog</b> records the run.</li></ol>';
  h += '<p class="muted">Press <b>Follow one task</b> to walk through these steps in the graph. Hover a circle to see its links, or click it for details. A ringed circle is a skill you can type yourself. The buttons at the top add the third-party extras and the plan.</p>';
  h += '<h3>Start here</h3><ul>' + nodes.filter(function (n) { return n.typed; }).map(function (n) { return item(n, '/' + n.label); }).join('') + '</ul>';
  h += group('Provider repos', nodes.filter(function (n) { return n.kind === 'source'; }));
  if (D.plan) {
    h += '<h3>Plan</h3><p><a href="' + esc(D.plan.url) + '" target="_blank" rel="noopener">' + esc(D.plan.title) + '</a></p>';
    D.plan.phases.forEach(function (p) {
      if (!p.tickets.length) return;
      h += '<h3>' + esc(p.name) + '</h3><ul>' + p.tickets.map(function (id) { return item(byId[id]); }).join('') + '</ul>';
    });
  }
  return h + '<p class="muted foot">' + nodes.length + ' nodes and ' + edges.length +
    ' links, generated from the repository. <a href="' + esc(D.repo) + '" target="_blank" rel="noopener">View on GitHub</a></p>';
}
function detail(n) {
  var k = KINDS[n.kind];
  var h = '<p><span class="tag k-' + n.kind + '">' + esc(k.label) + '</span>' +
    (n.typed ? ' <span class="muted">you type /' + esc(n.label) + '</span>' : '') +
    (n.phase ? ' <span class="muted">' + esc(n.phase) + '</span>' : '') + '</p>';
  h += '<h2>' + esc(n.kind === 'ticket' ? n.label + ': ' + n.title : n.label) + '</h2>';
  h += '<p>' + esc(n.desc || '') + '</p>';
  if (n.touches) h += '<p class="muted">Touches: ' + esc(n.touches) + '</p>';
  if (n.refs && n.refs.length) h += '<p class="muted">Reference files: ' + esc(n.refs.join(', ')) + '</p>';
  h += '<div class="actions"><a class="btn" href="' + esc(n.url) + '" target="_blank" rel="noopener">Open on GitHub</a>' +
    '<button type="button" class="btn" id="back">Back to overview</button></div>';
  Object.keys(REL).forEach(function (type) {
    h += group(REL[type].out, n.out.filter(function (e) { return e.type === type; }).map(function (e) { return e.t; }));
  });
  Object.keys(REL).forEach(function (type) {
    h += group(REL[type].inn, n.inn.filter(function (e) { return e.type === type; }).map(function (e) { return e.s; }));
  });
  return h;
}
var panel = document.getElementById('panel');
function setHash(value) {
  try { history.replaceState(null, '', value ? '#' + encodeURIComponent(value) : location.pathname + location.search); } catch (e) {}
}
function select(id) {
  selected = id ? byId[id] : null;
  if (selected && !shown[selected.kind]) setKind(selected.kind, true);
  panel.innerHTML = selected ? detail(selected) : overview();
  panel.scrollTop = 0;
  setHash(selected ? selected.id : currentView);
  refresh();
}
panel.addEventListener('click', function (ev) {
  var li = ev.target.closest('li.link');
  if (li) select(li.getAttribute('data-id'));
  else if (ev.target.id === 'back') select(null);
});

// Views are presets over the legend's on and off switches.
var CORE = ['manager', 'front', 'seat', 'procedure'];
var VIEWS = {
  core:   { label: 'Core skills', kinds: CORE },
  extras: { label: '+ Extras', kinds: CORE.concat(['extra', 'source']) },
  plan:   { label: '+ Plan', kinds: CORE.concat(['ticket']) },
  all:    { label: 'Everything', kinds: Object.keys(KINDS) }
};
var chips = {}, viewButtons = {}, currentView = '';
function sync(view) {
  currentView = view || '';
  Object.keys(KINDS).forEach(function (kind) {
    chips[kind].className = 'k-' + kind + (shown[kind] ? '' : ' off');
    chips[kind].setAttribute('aria-pressed', shown[kind] ? 'true' : 'false');
  });
  Object.keys(VIEWS).forEach(function (v) { viewButtons[v].setAttribute('aria-pressed', String(v === view)); });
  refresh(); settle();
}
function setKind(kind, on) { shown[kind] = on; sync(null); }
function setView(view) {
  Object.keys(KINDS).forEach(function (kind) { shown[kind] = VIEWS[view].kinds.indexOf(kind) >= 0; });
  if (selected && !shown[selected.kind]) { selected = null; panel.innerHTML = overview(); }
  sync(view);
  if (!selected) setHash(view === 'core' ? '' : view);
}
Object.keys(VIEWS).forEach(function (view) {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = VIEWS[view].label;
  b.addEventListener('click', function () { setView(view); });
  viewButtons[view] = b;
  document.getElementById('views').appendChild(b);
});
Object.keys(KINDS).forEach(function (kind) {
  var c = document.createElement('li');
  c.tabIndex = 0; c.setAttribute('role', 'button');
  c.innerHTML = '<i></i>' + esc(KINDS[kind].label);
  function toggle() { setKind(kind, !shown[kind]); }
  c.addEventListener('click', toggle);
  c.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
  chips[kind] = c;
  document.getElementById('kinds').appendChild(c);
});
document.getElementById('q').addEventListener('input', function (ev) { query = ev.target.value.trim().toLowerCase(); if (query && walk != null) leaveWalk(); refresh(); });
document.getElementById('labels').addEventListener('change', function (ev) { svg.classList.toggle('nolabels', !ev.target.checked); });

// Follow one task: each step lights its skills in the graph and dims the rest.
// The steps are the walk-steps block above; a {name} in a step's text is a skill.
var WALK = JSON.parse(document.getElementById('walk-steps').textContent).map(function (st) {
  var ids = [];
  st.text.replace(/\{([^{}]*)\}/g, function (m, id) { if (byId[id] && ids.indexOf(id) < 0) ids.push(id); });
  return { title: st.title, ids: ids, plain: st.text.replace(/[{}]/g, ''),
    html: esc(st.text).replace(/\{([^{}]*)\}/g, function (m, id) {
      return byId[id] ? '<b class="sk k-' + byId[id].kind + '">' + id + '</b>' : id;
    }) };
});
var WALK_SEEN = 'agent-skills-walk-seen';
var walk = null, walkBox = document.getElementById('walk');
var walkOpen = document.getElementById('walk-open'), walkBack = document.getElementById('walk-b'), walkNext = document.getElementById('walk-f');
function walkSet() { var m = {}; WALK[walk].ids.forEach(function (id) { m[id] = true; }); return m; }
function showStep(i) {
  walk = i;
  var st = WALK[i], count = 'Step ' + (i + 1) + ' of ' + WALK.length;
  document.getElementById('walk-n').textContent = 'Follow one task: ' + count.toLowerCase();
  document.getElementById('walk-t').textContent = st.title;
  document.getElementById('walk-p').innerHTML = st.html;
  // Read out by a screen reader each time the step changes.
  document.getElementById('walk-say').textContent = count + '. ' + st.title + '. ' + st.plain;
  // A disabled button cannot hold the focus, so hand it on first.
  if (i === 0 && document.activeElement === walkBack) walkNext.focus();
  walkBack.disabled = i === 0;
  walkNext.textContent = i === WALK.length - 1 ? 'Done' : 'Next';
  walkBox.hidden = false; document.body.classList.add('walking');
  walkOpen.setAttribute('aria-expanded', 'true');
  refresh(); fit();
}
// asked: the visitor pressed the button, so the keyboard focus follows them in.
function startWalk(asked) {
  if (!WALK.length) return;
  try { localStorage.setItem(WALK_SEEN, '1'); } catch (e) { /* No storage: it opens again next time. */ }
  selected = null; hover = null; panel.innerHTML = overview();
  setView('core'); showStep(0);
  if (asked) walkNext.focus();
}
function leaveWalk() {
  if (walk == null) return;
  var inside = walkBox.contains(document.activeElement);
  walk = null; walkBox.hidden = true; document.body.classList.remove('walking');
  walkOpen.setAttribute('aria-expanded', 'false');
  document.getElementById('walk-say').textContent = '';
  if (inside) walkOpen.focus();
  refresh(); fit();
}
walkOpen.setAttribute('aria-expanded', 'false');
walkOpen.setAttribute('aria-controls', 'walk');
walkOpen.addEventListener('click', function () { startWalk(true); });
document.getElementById('walk-x').addEventListener('click', leaveWalk);
walkBack.addEventListener('click', function () { if (walk > 0) showStep(walk - 1); });
walkNext.addEventListener('click', function () { if (walk < WALK.length - 1) showStep(walk + 1); else leaveWalk(); });
document.addEventListener('keydown', function (ev) {
  if (walk == null || ev.target.tagName === 'INPUT' || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.key === 'Escape') leaveWalk();
  else if (ev.key === 'ArrowRight' && walk < WALK.length - 1) showStep(walk + 1);
  else if (ev.key === 'ArrowLeft' && walk > 0) showStep(walk - 1);
});

// The address can name a view (#all) or a node (#mid), so a link opens where you were.
// #walk starts the walkthrough.
var start = decodeURIComponent(location.hash.slice(1));
panel.innerHTML = overview();
if (byId[start]) { setView(CORE.indexOf(byId[start].kind) >= 0 ? 'core' : 'all'); select(start); }
else setView(VIEWS[start] ? start : 'core');
window.addEventListener('resize', fit);
// A first visit opens on step one, unless the address asked for something else.
var walkSeen = false;
try { walkSeen = localStorage.getItem(WALK_SEEN) === '1'; } catch (e) { /* No storage: treat it as a first visit. */ }
if (start === 'walk' || (!start && !walkSeen)) startWalk(false);
window.addEventListener('hashchange', function () { if (location.hash === '#walk') startWalk(false); });
</script>
</body>
</html>
